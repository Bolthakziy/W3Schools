<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
	</head>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
	<body>
		<canvas id="oMeuCoelho" style="width:100%;max-width:600px"></canvas>
		<script>
			const xValues = ["Alexandre", "Iria", "Henrique", "Fernando"];
			const yValues = [35, 27, 45, 17];
			const barColors = ["#b91d47", "#2b5797", "#e8c3b9", "#1e7145"];
			const ctx = document.getElementById("oMeuCoelho");

			new Chart (ctx, {
				type : "pie",
				data : {
					labels : xValues,
					datasets : [{
						backgroundColor : barColors,
						data : yValues
					}]
				},
				options : {
					plugins: {
						legend : {display : true},
						title : {
							display : true,
							text : "Os meus Amigos!",
							font : {size : 16}
						}
					}
				}
			});
		</script>
	</body>
</html>
