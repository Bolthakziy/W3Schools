<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
	</head>
	<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
	<body>
		<div id="coelho" style="width:100%;max-width:700px"></div>
		<script>
			let exp = "Math.cos(x)";
			const xValues = [];
			const yValues = [];

			for (let x = 0; x <= 10; x += 0.1) {
				xValues.push(x);
				yValues.push(eval(exp));
			}

			const data = [{x:xValues,y:yValues,mode:"lines"}];
			const layout = {title:"y = " + exp};

			Plotly.newPlot("coelho", data, layout);
		</script>
	</body>
</html>
